[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "genomde2fhir"
version = "0.2.0"
description = "Convert genomDE / MV-GenomSeq Datenkranz JSON (KDK oncology, KDK rare disease, GRZ) into MII KDS FHIR R4 transaction Bundles (2027.0.0 ballot profile set)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KohlbacherLab" }]
keywords = ["fhir", "genomde", "mv-genomseq", "datenkranz", "mii", "kerndatensatz", "bfarm", "kdk", "grz"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Healthcare Industry",
]
dependencies = [
    "fhir.resources>=8.3,<9",   # structural check of every emitted resource (R4B models = R4 for all types we emit)
]

[project.optional-dependencies]
# input gate: schema validation, undeclared-field detection, branch detection. genomde-dk-validator is not on PyPI,
# so this extra cannot resolve from an index; install it from git into the environment genomde2fhir runs in:
#   pipx inject genomde2fhir "genomde-dk-validator @ git+https://github.com/KohlbacherLab/genomde-dk-validator@v1.1.3"
#   <that python> -m pip install "genomde-dk-validator @ git+https://github.com/KohlbacherLab/genomde-dk-validator@v1.1.3"
# Without it `genomde2fhir convert` refuses to run (exit 1) unless --no-input-check is given; the Python API converts
# and notes 'input validation skipped' in the report.
input = ["genomde-dk-validator>=1.1.3"]
dev = ["pytest>=8", "genomde-dk-validator>=1.1.3"]

[project.urls]
Homepage = "https://github.com/KohlbacherLab/genomDE2FHIR"
Repository = "https://github.com/KohlbacherLab/genomDE2FHIR"

[project.scripts]
genomde2fhir = "genomde2fhir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genomde2fhir = ["data/*.json", "data/mapping/*.csv", "data/mvgs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
